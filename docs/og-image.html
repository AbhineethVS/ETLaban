<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 link preview.
  Regenerate from the repo root:
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 --screenshot=public/og-image.png docs/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=block"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        gap: 56px;
        padding: 72px 88px;
        background: #f7f5f0;
        color: #161512;
        font-family: "Geist", system-ui, sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 52px; }
      .brand img { width: 44px; height: 44px; }
      .wordmark { font-family: "Instrument Serif", serif; font-size: 36px; letter-spacing: -0.01em; }
      .wordmark em, h1 em { color: #d4572a; }
      .kicker {
        display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
        color: #6b675f; font-family: "Geist Mono", monospace; font-size: 17px; font-weight: 500;
        letter-spacing: 0.12em; text-transform: uppercase;
      }
      .kicker i { width: 8px; height: 8px; border-radius: 50%; background: #d4572a; }
      h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: 96px; line-height: 0.98; letter-spacing: -0.03em; }
      p { margin-top: 26px; color: #6b675f; font-size: 25px; line-height: 1.45; }
      .card {
        padding: 30px 30px 26px;
        border-radius: 20px;
        background: #fffefb;
        box-shadow: 0 1px 2px rgba(22, 21, 18, 0.04), 0 24px 50px -20px rgba(22, 21, 18, 0.22);
      }
      .card-title { color: #6b675f; font-family: "Geist Mono", monospace; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
      .ring { position: relative; width: 168px; height: 168px; margin: 18px auto 22px; }
      .ring svg { transform: rotate(-90deg); }
      .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-family: "Instrument Serif", serif; font-size: 56px; }
      ul { padding: 0; list-style: none; }
      li { display: grid; grid-template-columns: 1fr 70px 28px; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid rgba(22, 21, 18, 0.09); font-size: 15px; }
      .bar { height: 4px; border-radius: 2px; background: rgba(22, 21, 18, 0.09); }
      .bar b { display: block; height: 100%; border-radius: 2px; background: #161512; }
      .low .bar b { background: #d4572a; }
      .v { text-align: right; font-family: "Geist Mono", monospace; font-size: 13px; }
    </style>
  </head>
  <body>
    <div>
      <div class="brand">
        <img src="../public/icon.svg" alt="" />
        <span class="wordmark">ET<em>Laban</em></span>
      </div>
      <div class="kicker"><i></i>Made for CET Trivandrum</div>
      <h1>Same data,<br /><em>less</em> suffering.</h1>
      <p>Your ETLab attendance, results and<br />study materials in one calm, fast app.</p>
    </div>
    <div class="card">
      <div class="card-title">Attendance</div>
      <div class="ring">
        <svg viewBox="0 0 148 148" width="168" height="168">
          <circle cx="74" cy="74" r="64" fill="none" stroke="rgba(22,21,18,0.08)" stroke-width="8" />
          <circle cx="74" cy="74" r="64" fill="none" stroke="#161512" stroke-width="8" stroke-linecap="round" pathLength="100" stroke-dasharray="91 100" />
        </svg>
        <span>91%</span>
      </div>
      <ul>
        <li><span>Mathematics</span><span class="bar"><b style="width: 93%"></b></span><span class="v">93</span></li>
        <li><span>Data Structures</span><span class="bar"><b style="width: 89%"></b></span><span class="v">89</span></li>
        <li class="low"><span>Systems Lab</span><span class="bar"><b style="width: 76%"></b></span><span class="v">76</span></li>
      </ul>
    </div>
  </body>
</html>
