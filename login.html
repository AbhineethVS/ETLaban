<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <script>
      (() => {
        const root = document.documentElement;
        let theme = null;
        let signedIn = false;
        try {
          theme = localStorage.getItem("better-etlab-theme");
          signedIn = localStorage.getItem("better-etlab-signed-in") === "1";
        } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.dataset.theme = theme;
        root.classList.add("js");
        if (signedIn) root.classList.add("is-checking");
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#0f0f0e" : "#f7f5f0");
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Better ETLab" />
    <title>Log in · Better ETLab</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="public.css" />
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="/" aria-label="Better ETLab home">
        <img src="icon.svg" alt="" width="28" height="28" />
        <span class="wordmark"><em>Better</em> ETLab</span>
      </a>
      <div class="nav-actions">
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Switch theme">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.1A8.5 8.5 0 0 1 9.9 3.5a8.5 8.5 0 1 0 10.6 10.6Z" />
          </svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
          </svg>
        </button>
      </div>
    </header>

    <main class="auth">
      <div class="auth-panel">
        <div class="auth-head">
          <h1 class="display">
            <span class="w" style="--i: 0">Hello</span>
            <span class="w" style="--i: 1"><em>there.</em></span>
          </h1>
          <p class="lede rise" style="--d: 2">Log in with your ETLab username and password.</p>
        </div>

        <p id="login-note" class="notice" role="status" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5V12l3 2" />
          </svg>
          <span></span>
        </p>

        <div class="rise" style="--d: 3">
          <form id="login-form" class="auth-form" novalidate>
            <div class="field">
              <label for="username">Username</label>
              <input
                id="username"
                class="input"
                name="username"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="next"
                required
              />
            </div>

            <div class="field">
              <div class="field-row">
                <label for="password">Password</label>
                <span id="caps-hint" class="caps-hint" aria-live="polite">Caps Lock is on</span>
              </div>
              <div class="input-wrap">
                <input
                  id="password"
                  class="input"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  enterkeyhint="go"
                  required
                />
                <button
                  id="password-toggle"
                  class="icon-btn input-action"
                  type="button"
                  aria-label="Show password"
                  aria-pressed="false"
                  aria-controls="password"
                >
                  <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10.6 5.6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-2.6 3.4M6.6 6.6C3.9 8.3 2.5 12 2.5 12S6 18.5 12 18.5a9 9 0 0 0 5.4-1.9" />
                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18" />
                  </svg>
                </button>
              </div>
            </div>

            <p id="login-error" class="form-error" role="alert" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7.5v5M12 16.2v.3" />
              </svg>
              <span></span>
            </p>

            <button class="btn btn-primary btn-lg btn-block" type="submit" data-state="idle">
              <span class="btn-state btn-state-idle">
                Log in
                <svg class="btn-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 8h10M9 4l4 4-4 4" />
                </svg>
              </span>
              <span class="btn-state btn-state-busy" aria-hidden="true">
                <span class="spinner"></span>
                Signing in
              </span>
              <span class="btn-state btn-state-done" aria-hidden="true">
                <svg class="check" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 8.5 6.5 12 13 4.5" />
                </svg>
                Opening dashboard
              </span>
            </button>
            <p id="login-status" class="sr-only" aria-live="polite"></p>
          </form>
        </div>

        <p class="auth-foot rise" style="--d: 5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.5" />
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" />
          </svg>
          Used once to sign in. Never stored.
        </p>
      </div>
    </main>

    <script src="login.js" type="module"></script>
  </body>
</html>
